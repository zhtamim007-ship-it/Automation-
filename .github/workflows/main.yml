name: Run BitNest Automation

on:
  schedule:
 - cron: '*/6 * * * *' # Runs every hour

jobs:
  build-and-deploy:
 runs-on: ubuntu-latest
 
steps:
 - name: Checkout code
 uses: actions/checkout@v3
 
 - name: Set up Python
 uses: actions/setup-python@v4
 
 - name: Install dependencies
 run: |
 python -m pip install --upgrade pip
 pip install selenium fake-useragent requests webdriver-manager
 
 - name: Download ChromeDriver via Webdriver Manager to avoid manual version matching.
 run : |
 pip install webdriver-manager
 
 - name : Setup ChromeDriver using WebdriverManager.
 run : |
 python bitnest_automation.py 
 
